<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@common*/
        .s2 svg.dr .v path { stroke-width: 0.42; }
        .s2 svg.dr .h path { stroke-width: 0.28; }
        .s2 .stage { position: absolute; left: 60px; top: 90px; width: 1300px; height: 900px; display: flex; align-items: center; justify-content: center; }
        .s2 svg.dr { width: 1280px; height: auto; }
        .s2 .logbox { position: absolute; left: 1420px; top: 150px; width: 460px; }
        .s2 .logbox .hd { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 18px; letter-spacing: 0.12em; color: #6f6f6f; margin-bottom: 18px; opacity: 0; }
        .s2 .render { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
        .s2 .render img { width: 1920px; height: auto; display: block; }
        .s2 .det { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
        .s2 .photo { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
        .s2 .photo img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; display: block; }
        .s2 .photo .tag { position: absolute; left: 60px; bottom: 56px; font-size: 24px; padding: 10px 18px; opacity: 0; }
        .s2 .det img { width: 1920px; height: auto; display: block; }
        .s2 .det .tag, .s2 .render .tag { position: absolute; left: 60px; bottom: 56px; font-size: 24px; padding: 10px 18px; }
        .s2 .det .tag { opacity: 0; }
        .s2 .render .tag { opacity: 0; }
        .s2 .wrap { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s2-nes" data-width="1920" data-height="1080">
        <div class="s2">
          <div class="wrap">
            <div class="grid"></div>
            <div class="vignette"></div>
            <div class="stage">
              <!--@svg:nes-iso-->
            </div>
            <div class="logbox">
              <div class="hd">TOOL CALLS · plasticity-mcp</div>
              <div class="log">
                <div class="ln"><span class="k">import_svg</span><span class="arg">nes-front.svg</span></div>
                <div class="ln"><span class="k">create_polyline</span><span class="arg">closed, 14 pts</span></div>
                <div class="ln"><span class="k">extrude_profile</span><span class="arg">h=86</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">create_box</span><span class="arg">cartridge slot</span></div>
                <div class="ln"><span class="k">boolean</span><span class="arg">difference</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">array_rectangular</span><span class="arg">vents 14×</span></div>
                <div class="ln"><span class="k">fillet</span><span class="arg">r=2.5 · 24 edges</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">create_spline</span><span class="arg">controller cable</span></div>
                <div class="ln"><span class="k">sweep_profile</span><span class="arg">ø3.2</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">create_text</span><span class="arg">"Nintendo"</span></div>
                <div class="ln"><span class="k">chamfer</span><span class="arg">0.4 · door flap</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">check_bodies</span><span class="ok">7 bodies · ok</span></div>
              </div>
            </div>
            <div class="render">
              <img src="assets/img/nes-iso.png" alt="" />
              <div class="tag">check_bodies → <span class="green">7 bodies · 0 errors</span></div>
            </div>
            <div class="photo">
              <img src="assets/steel/nes-steel.png" alt="" />
              <div class="tag">render → <span class="tan">Cycles</span> · brushed steel</div>
            </div>
            <div class="det d1"><img src="assets/img/nes-d-logo.png" alt="" /><div class="tag">create_text → boolean <span class="tan">difference</span> · engraved logo</div></div>
            <div class="det d2"><img src="assets/img/nes-d-dpad.png" alt="" /><div class="tag">sweep_profile · <span class="tan">coiled cable</span> · fillet r=0.8</div></div>
            <div class="det d3"><img src="assets/img/nes-d-cart.png" alt="" /><div class="tag">array_rectangular · <span class="tan">vents 14×</span> · chamfer 0.4</div></div>
          </div>
        </div>
      </div>
      <script>
        //@helpers
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(".s2 " + s);
          // line drawing draws itself: visible lines sweep, hidden lines follow
          drawOn(tl, ".s2 svg.dr .v path", 0.3, 6.2, 1.3, "power1.out");
          tl.set(q("svg.dr .h"), { opacity: 0.85 }, 0);
          drawOn(tl, ".s2 svg.dr .h path", 1.6, 5.6, 1.1, "none");
          // log
          tl.set(q(".logbox .hd"), { opacity: 1 }, 0.5);
          logIn(tl, ".s2 .log .ln", 0.8, 0.55, -14);
          // flash + dissolve into the shaded render
          tl.to(".s2 svg.dr .v path", { stroke: "#c9a57e", duration: 0.2, ease: "power1.in" }, 7.5);
          tl.to(q(".stage"), { opacity: 0, scale: 1.04, duration: 0.6, ease: "power2.in" }, 7.75);
          tl.to(q(".logbox"), { opacity: 0, x: 30, duration: 0.4, ease: "power2.in" }, 7.6);
          tl.fromTo(q(".render"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 7.9);
          tl.fromTo(q(".render img"), { scale: 1.75 }, { scale: 1.58, duration: 0.8, ease: "power2.out" }, 7.9);
          tl.set(q(".render .tag"), { opacity: 1 }, 8.9);
          tl.fromTo(q(".render .tag"), { x: -16 }, { x: 0, duration: 0.3, ease: "power3.out" }, 8.9);
          tl.to(q(".render img"), { scale: 1.64, duration: 1.3, ease: "none" }, 8.7);
          // photoreal beat: crossfade, same slow push-in
          tl.fromTo(q(".photo"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 9.7);
          tl.fromTo(q(".photo img"), { scale: 1.0 }, { scale: 1.06, duration: 2.4, ease: "none" }, 9.7);
          tl.set(q(".photo .tag"), { opacity: 1 }, 10.3);
          tl.fromTo(q(".photo .tag"), { x: -16 }, { x: 0, duration: 0.3, ease: "power3.out" }, 10.3);
          // detail punch-ins: hard cuts + slow drift (scale keeps the viewport gizmo out of frame)
          const dets = [[".d1", 12.0, 1.4], [".d2", 13.4, 1.3], [".d3", 14.7, 1.3]];
          dets.forEach(([sel, at, dur]) => {
            tl.set(q(sel), { opacity: 1 }, at);
            tl.fromTo(q(sel + " img"), { scale: 1.18, x: 0 }, { scale: 1.25, x: -20, duration: dur + 0.05, ease: "none" }, at);
            tl.set(q(sel + " .tag"), { opacity: 1 }, at + 0.15);
            tl.fromTo(q(sel + " .tag"), { x: -16 }, { x: 0, duration: 0.3, ease: "power3.out" }, at + 0.15);
          });
          tl.set(q(".render"), { opacity: 0 }, 10.4);
          tl.set(q(".photo"), { opacity: 0 }, 12.0);
          tl.set(q(".d1"), { opacity: 0 }, 13.4);
          tl.set(q(".d2"), { opacity: 0 }, 14.7);
          window.__timelines["s2-nes"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
