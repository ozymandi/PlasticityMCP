<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@common*/
        .s4 .mon { position: absolute; left: 64px; top: 120px; width: 1368px; height: 770px; border-radius: 14px; overflow: hidden;
          border: 1px solid #3a3a3a; box-shadow: 0 30px 80px rgba(0,0,0,0.6); background: #111; opacity: 0; }
        .s4 .mon video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        .s4 .bar { position: absolute; left: 0; top: 0; right: 0; height: 34px; background: #1e1e1e; border-bottom: 1px solid #2c2c2c; display: flex; align-items: center; padding-left: 14px; gap: 8px; }
        .s4 .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a3a3a; display: block; }
        .s4 .bar span { margin-left: 14px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 14px; color: #777; letter-spacing: 0.06em; }
        .s4 .live { position: absolute; right: 16px; top: 8px; display: flex; align-items: center; gap: 8px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: #2fd27a; letter-spacing: 0.1em; }
        .s4 .live i { width: 8px; height: 8px; border-radius: 50%; background: #2fd27a; display: block; }
        .s4 .logbox { position: absolute; left: 1480px; top: 150px; width: 400px; height: 720px; overflow: hidden; }
        .s4 .logbox .hd { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 18px; letter-spacing: 0.12em; color: #6f6f6f; margin-bottom: 18px; opacity: 0; }
        .s4 .log { font-size: 20px; }
        .s4 .log .ln { gap: 10px; }
        .s4 .caption { position: absolute; left: 64px; bottom: 92px; display: flex; gap: 14px; align-items: center; opacity: 0; }
        .s4 .caption .tag { font-size: 24px; padding: 10px 18px; }
        .s4 .wrap { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s4-orbit" data-width="1920" data-height="1080">
        <div class="s4">
          <div class="wrap">
            <div class="grid"></div>
            <div class="vignette"></div>
            <div class="mon">
              <video id="s4-orbit-video" src="assets/video/orbit-16x9.mp4" muted playsinline data-start="0" data-duration="12" data-media-start="1.5" data-playback-rate="1.3" data-track-index="1"></video>
              <div class="bar"><i></i><i></i><i></i><span>Plasticity 26.1.3 — NES.plasticity</span><div class="live"><i></i>LIVE · MCP</div></div>
            </div>
            <div class="logbox">
              <div class="hd">SESSION LOG</div>
              <div class="log">
                <div class="ln"><span class="k">native_connect</span><span class="ok">127.0.0.1:9223</span></div>
                <div class="ln"><span class="k">list_bodies</span><span class="arg">7</span></div>
                <div class="ln"><span class="k">get_body_topology</span><span class="arg">box filter</span></div>
                <div class="ln"><span class="k">fillet</span><span class="arg">r=1.0 · loop</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">set_view</span><span class="arg">iso</span></div>
                <div class="ln"><span class="k">screenshot</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">move_bodies</span><span class="arg">[0,-40,0]</span></div>
                <div class="ln"><span class="k">group_bodies</span><span class="arg">Controller_1</span></div>
                <div class="ln"><span class="k">set_material</span><span class="arg">matcap-tan</span></div>
                <div class="ln"><span class="k">undo</span><span class="arg">1 step</span></div>
                <div class="ln"><span class="k">redo</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">export_step</span><span class="arg">nes.step</span></div>
                <div class="ln"><span class="k">export_drawing</span><span class="arg">7 views → svg</span></div>
                <div class="ln"><span class="k">save_document</span><span class="ok">✓</span></div>
              </div>
            </div>
            <div class="caption">
              <div class="tag">native <span class="tan">B-Rep</span></div>
              <div class="tag">every step in Plasticity's <span class="tan">undo history</span></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        //@helpers
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(".s4 " + s);
          tl.fromTo(q(".mon"), { opacity: 0, scale: 0.96, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
          tl.set(q(".logbox .hd"), { opacity: 1 }, 0.5);
          logIn(tl, ".s4 .log .ln", 0.8, 0.72, -14);
          tl.set(q(".caption"), { opacity: 1 }, 1.4);
          tl.fromTo(q(".caption"), { y: 16 }, { y: 0, duration: 0.4, ease: "power3.out" }, 1.4);
          tl.to(q(".wrap"), { opacity: 0, duration: 0.3, ease: "power1.in" }, 11.7);
          window.__timelines["s4-orbit"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
