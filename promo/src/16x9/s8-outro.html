<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@common*/
        .s8 svg.dr .v path { stroke-width: 0.2; }
        .s8 svg.dr .h path { stroke-width: 0.13; }
        .s8 .bg { position: absolute; left: 50%; top: 50%; width: 2400px; margin-left: -1200px; margin-top: -400px; opacity: 0.5; }
        .s8 .bg svg.dr { width: 2400px; height: auto; }
        .s8 .bg svg.dr .v path { stroke: #9a968e; }
        .s8 .bg svg.dr .h path { stroke: #4a4a4a; }
        .s8 .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .s8 .lock { display: flex; align-items: baseline; gap: 0; opacity: 0; }
        .s8 .lock .a { font-family: "Adhesive Nr. Eight", "Owners", sans-serif; font-weight: 400; font-synthesis: none; font-size: 150px; letter-spacing: 0; color: #ece9e2; line-height: 1; }
        .s8 .lock .b { font-family: "Adhesive Nr. Eight", "Owners", sans-serif; font-weight: 400; font-synthesis: none; font-size: 150px; letter-spacing: 0; color: #c9a57e; line-height: 1; }
        .s8 .url { font-family: "Owners", sans-serif; font-size: 34px; color: #bdbab3; margin-top: 34px; letter-spacing: 0.02em; opacity: 0; }
        .s8 .url span { color: #6f6f6f; }
        .s8 .small { font-family: "Owners", sans-serif; font-size: 20px; color: #6f6f6f; margin-top: 22px; letter-spacing: 0.12em; opacity: 0; }
        .s8 .plate { position: absolute; left: 50%; top: 50%; width: 1240px; height: 440px; margin-left: -620px; margin-top: -220px; background: rgba(22,22,22,0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 24px; opacity: 0; }
        .s8 .wrap { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s8-outro" data-width="1920" data-height="1080">
        <div class="s8">
          <div class="wrap">
            <div class="grid"></div>
            <div class="bg"><!--@svg:nes-front--></div>
            <div class="vignette"></div>
            <div class="plate"></div>
            <div class="center">
              <div class="lock"><span class="a">Plasticity</span><span class="b">MCP</span></div>
              <div class="url"><span>github.com/</span>ozymandi/PlasticityMCP</div>
              <div class="small">UNOFFICIAL · INTERNAL USE · PLASTICITY 26.1.3</div>
            </div>
          </div>
        </div>
      </div>
      <script>
        //@helpers
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(".s8 " + s);
          drawOn(tl, ".s8 svg.dr .v path", 0, 2.4, 0.7, "power1.out");
          tl.set(q("svg.dr .h"), { opacity: 0.6 }, 0);
          drawOn(tl, ".s8 svg.dr .h path", 0.4, 2.2, 0.6, "none");
          tl.fromTo(q(".plate"), { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
          tl.set(q(".lock"), { opacity: 1 }, 0.6);
          tl.fromTo(q(".lock"), { scale: 1.14, y: 10 }, { scale: 1, y: 0, duration: 0.55, ease: "power4.out" }, 0.6);
          tl.set(q(".url"), { opacity: 1 }, 1.2);
          tl.fromTo(q(".url"), { y: 14 }, { y: 0, duration: 0.4, ease: "power3.out" }, 1.2);
          tl.set(q(".small"), { opacity: 1 }, 1.7);
          tl.fromTo(q(".small"), { y: 10 }, { y: 0, duration: 0.4, ease: "power3.out" }, 1.7);
          window.__timelines["s8-outro"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
