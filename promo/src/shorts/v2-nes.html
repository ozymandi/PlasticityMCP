<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@common*/
        .v2 svg.dr .v path { stroke-width: 0.52; }
        .v2 svg.dr .h path { stroke-width: 0.34; }
        .v2 .stage { position: absolute; left: 0; top: 300px; width: 1080px; height: 760px; display: flex; align-items: center; justify-content: center; }
        .v2 svg.dr { width: 1040px; height: auto; }
        .v2 .logbox { position: absolute; left: 80px; top: 1130px; width: 920px; }
        .v2 .logbox .hd { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 22px; letter-spacing: 0.12em; color: #858585; margin-bottom: 18px; opacity: 0; }
        .v2 .log { font-size: 27px; line-height: 1.6; }
        .v2 .render { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
        .v2 .render img, .v2 .det img { position: absolute; left: 50%; top: 50%; width: 1800px; height: auto; margin-left: -900px; margin-top: -546px; display: block; }
        .v2 .det { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
        .v2 .photo { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
        .v2 .photo img { position: absolute; left: 50%; top: 50%; width: 2560px; height: 1440px; margin-left: -1280px; margin-top: -720px; display: block; }
        .v2 .tag { position: absolute; left: 80px; bottom: 300px; font-size: 28px; padding: 14px 20px; opacity: 0; }
        .v2 .top { position: absolute; left: 80px; top: 120px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 26px; color: #858585; letter-spacing: 0.1em; opacity: 0; }
        .v2 .top b { color: #c9a57e; font-weight: 500; }
        .v2 .wrap { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="v2-nes" data-width="1080" data-height="1920">
        <div class="v2">
          <div class="wrap">
            <div class="grid"></div>
            <div class="vignette"></div>
            <div class="top">&gt; model a <b>Nintendo NES</b> from drawings</div>
            <div class="stage"><!--@svg:nes-iso--></div>
            <div class="logbox">
              <div class="hd">TOOL CALLS · plasticity-mcp</div>
              <div class="log">
                <div class="ln"><span class="k">import_svg</span><span class="arg">nes-front.svg</span></div>
                <div class="ln"><span class="k">extrude_profile</span><span class="arg">h=86</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">boolean</span><span class="arg">difference</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">array_rectangular</span><span class="arg">vents 14×</span></div>
                <div class="ln"><span class="k">fillet</span><span class="arg">r=2.5 · 24 edges</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">sweep_profile</span><span class="arg">cable ø3.2</span><span class="ok">✓</span></div>
                <div class="ln"><span class="k">create_text</span><span class="arg">"Nintendo"</span></div>
                <div class="ln"><span class="k">check_bodies</span><span class="ok">7 bodies · ok</span></div>
              </div>
            </div>
            <div class="render"><img src="assets/img/nes-iso.png" alt="" /></div>
            <div class="photo"><img src="assets/steel/nes-steel.png" alt="" /></div>
            <div class="det d1"><img src="assets/img/nes-d-logo.png" alt="" /></div>
            <div class="det d2"><img src="assets/img/nes-d-dpad.png" alt="" /></div>
            <div class="tag t0">check_bodies → <span class="green">7 bodies · 0 errors</span></div>
            <div class="tag tp">render → <span class="tan">Cycles</span> · steel</div>
            <div class="tag t1">create_text → boolean <span class="tan">difference</span></div>
            <div class="tag t2">sweep_profile · <span class="tan">coiled cable</span></div>
          </div>
        </div>
      </div>
      <script>
        //@helpers
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(".v2 " + s);
          tl.set(q(".top"), { opacity: 1 }, 0.1);
          drawOn(tl, ".v2 svg.dr .v path", 0.2, 4.3, 1.0, "power1.out");
          tl.set(q("svg.dr .h"), { opacity: 0.85 }, 0);
          drawOn(tl, ".v2 svg.dr .h path", 1.0, 4.0, 0.9, "none");
          tl.set(q(".logbox .hd"), { opacity: 1 }, 0.4);
          logIn(tl, ".v2 .log .ln", 0.6, 0.5, -14);
          tl.to(".v2 svg.dr .v path", { stroke: "#c9a57e", duration: 0.2 }, 5.2);
          tl.to(q(".stage"), { opacity: 0, scale: 1.04, duration: 0.5, ease: "power2.in" }, 5.4);
          tl.to(q(".logbox"), { opacity: 0, y: 30, duration: 0.4, ease: "power2.in" }, 5.3);
          tl.to(q(".top"), { opacity: 0, duration: 0.3 }, 5.3);
          tl.fromTo(q(".render"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 5.6);
          tl.fromTo(q(".render img"), { scale: 1.9 }, { scale: 1.7, duration: 0.8, ease: "power2.out" }, 5.6);
          tl.to(q(".render img"), { scale: 1.78, duration: 1.6, ease: "none" }, 6.4);
          tl.fromTo(q(".photo"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7.6);
          tl.fromTo(q(".photo img"), { scale: 1.0 }, { scale: 1.06, duration: 1.9, ease: "none" }, 7.6);
          tl.set(q(".tp"), { opacity: 1 }, 8.1);
          tl.fromTo(q(".tp"), { x: -16 }, { x: 0, duration: 0.3, ease: "power3.out" }, 8.1);
          tl.set(q(".t0"), { opacity: 1 }, 6.4);
          tl.fromTo(q(".t0"), { x: -16 }, { x: 0, duration: 0.3, ease: "power3.out" }, 6.4);
          const dets = [[".d1", ".t1", 9.5, 1.5], [".d2", ".t2", 11.0, 1.5]];
          dets.forEach(([sel, tag, at, dur]) => {
            tl.set(q(sel), { opacity: 1 }, at);
            tl.fromTo(q(sel + " img"), { scale: 1.3, x: 0 }, { scale: 1.38, x: -24, duration: dur + 0.05, ease: "none" }, at);
            tl.set(q(tag), { opacity: 1 }, at + 0.12);
            tl.fromTo(q(tag), { x: -16 }, { x: 0, duration: 0.3, ease: "power3.out" }, at + 0.12);
          });
          tl.set(q(".render"), { opacity: 0 }, 8.2); tl.set(q(".t0"), { opacity: 0 }, 8.1);
          tl.set(q(".photo"), { opacity: 0 }, 9.5); tl.set(q(".tp"), { opacity: 0 }, 9.5);
          tl.set(q(".d1"), { opacity: 0 }, 11.0); tl.set(q(".t1"), { opacity: 0 }, 11.0);
          tl.to(q(".wrap"), { opacity: 0, duration: 0.25, ease: "power1.in" }, 12.25);
          window.__timelines["v2-nes"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
