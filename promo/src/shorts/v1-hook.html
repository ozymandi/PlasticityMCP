<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@common*/
        .v1 .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 80px; }
        .v1 .w { display: block; font-family: "Adhesive Nr. Eight", Montserrat, sans-serif; font-weight: 400; font-synthesis: none; font-size: 150px; letter-spacing: 0; line-height: 0.95; color: #ece9e2; opacity: 0; }
        .v1 .w.t { color: #c9a57e; }
        .v1 .sub { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 30px; color: #8a8a8a; margin-top: 50px; letter-spacing: 0.08em; opacity: 0; }
        .v1 .brand { position: absolute; left: 80px; top: 120px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 26px; color: #858585; letter-spacing: 0.1em; opacity: 0; }
        .v1 .brand b { color: #c9a57e; font-weight: 500; }
        .v1 .wrap { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="v1-hook" data-width="1080" data-height="1920">
        <div class="v1">
          <div class="wrap">
            <div class="grid"></div>
            <div class="vignette"></div>
            <div class="brand">Plasticity<b>MCP</b></div>
            <div class="center">
              <div class="w">An LLM</div>
              <div class="w">modelled</div>
              <div class="w">this in</div>
              <div class="w t">Plasticity</div>
              <div class="sub">&gt; no mouse. 144 MCP tools.</div>
            </div>
          </div>
        </div>
      </div>
      <script>
        //@helpers
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(".v1 " + s);
          tl.set(q(".brand"), { opacity: 1 }, 0.1);
          // waterfall-entry: binary arrival + whip from below
          document.querySelectorAll(".v1 .w").forEach((w, i) => {
            const t = 0.15 + i * 0.13;
            tl.set(w, { opacity: 1 }, t);
            tl.fromTo(w, { y: 90, scale: 1.08 }, { y: 0, scale: 1, duration: 0.5, ease: "power4.out" }, t);
          });
          tl.set(q(".sub"), { opacity: 1 }, 0.95);
          tl.fromTo(q(".sub"), { x: -16 }, { x: 0, duration: 0.3, ease: "power3.out" }, 0.95);
          tl.to(q(".wrap"), { opacity: 0, duration: 0.25, ease: "power1.in" }, 1.95);
          window.__timelines["v1-hook"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
