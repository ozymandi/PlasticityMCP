<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@common*/
        .v8 svg.dr .v path { stroke-width: 0.25; }
        .v8 svg.dr .h path { stroke-width: 0.16; }
        .v8 .bg { position: absolute; left: 50%; top: 50%; width: 2000px; margin-left: -1000px; margin-top: -340px; opacity: 0.45; }
        .v8 .bg svg.dr { width: 2000px; height: auto; }
        .v8 .bg svg.dr .v path { stroke: #9a968e; }
        .v8 .bg svg.dr .h path { stroke: #4a4a4a; }
        .v8 .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .v8 .big { display: block; font-family: "Adhesive Nr. Eight", Montserrat, sans-serif; font-weight: 400; font-synthesis: none; font-size: 300px; letter-spacing: 0; line-height: 0.9; color: #ece9e2; font-variant-numeric: tabular-nums; opacity: 0; }
        .v8 .unit { display: block; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 30px; letter-spacing: 0.3em; color: #c9a57e; margin-top: 20px; opacity: 0; }
        .v8 .lock { display: flex; align-items: baseline; margin-top: 150px; opacity: 0; }
        .v8 .lock .a { font-family: "Adhesive Nr. Eight", Montserrat, sans-serif; font-weight: 400; font-synthesis: none; font-size: 96px; letter-spacing: 0; color: #ece9e2; line-height: 1; }
        .v8 .lock .b { font-family: "Adhesive Nr. Eight", Montserrat, sans-serif; font-weight: 400; font-synthesis: none; font-size: 96px; letter-spacing: 0; color: #c9a57e; line-height: 1; }
        .v8 .url { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 28px; color: #bdbab3; margin-top: 26px; opacity: 0; }
        .v8 .url span { color: #858585; }
        .v8 .small { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 18px; color: #858585; margin-top: 18px; letter-spacing: 0.12em; opacity: 0; }
        .v8 .plate { position: absolute; left: 50%; top: 50%; width: 960px; height: 900px; margin-left: -480px; margin-top: -450px; background: rgba(22,22,22,0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 28px; opacity: 0; }
        .v8 .wrap { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="v8-outro" data-width="1080" data-height="1920">
        <div class="v8">
          <div class="wrap">
            <div class="grid"></div>
            <div class="bg"><!--@svg:nes-front--></div>
            <div class="vignette"></div>
            <div class="plate"></div>
            <div class="center">
              <div class="big">0</div>
              <div class="unit">MCP TOOLS</div>
              <div class="lock"><span class="a">Plasticity</span><span class="b">MCP</span></div>
              <div class="url"><span>github.com/</span>ozymandi/PlasticityMCP</div>
              <div class="small">UNOFFICIAL · PLASTICITY 26.1.3 · WINDOWS</div>
            </div>
          </div>
        </div>
      </div>
      <script>
        //@helpers
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(".v8 " + s);
          drawOn(tl, ".v8 svg.dr .v path", 0, 2.0, 0.6, "power1.out");
          tl.set(q("svg.dr .h"), { opacity: 0.6 }, 0);
          drawOn(tl, ".v8 svg.dr .h path", 0.3, 1.8, 0.5, "none");
          tl.fromTo(q(".plate"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.1);
          const big = q(".big"); const proxy = { v: 0 };
          tl.set(big, { opacity: 1 }, 0.15);
          tl.to(proxy, { v: 144, duration: 1.3, ease: "power3.out", onUpdate: () => { big.textContent = String(Math.round(proxy.v)); } }, 0.15);
          tl.fromTo(big, { scale: 0.7 }, { scale: 1, duration: 1.3, ease: "power3.out" }, 0.15);
          tl.set(q(".unit"), { opacity: 1 }, 1.0);
          tl.fromTo(q(".unit"), { y: 12 }, { y: 0, duration: 0.4, ease: "power3.out" }, 1.0);
          tl.set(q(".lock"), { opacity: 1 }, 1.4);
          tl.fromTo(q(".lock"), { scale: 1.14, y: 10 }, { scale: 1, y: 0, duration: 0.5, ease: "power4.out" }, 1.4);
          tl.set(q(".url"), { opacity: 1 }, 1.8);
          tl.fromTo(q(".url"), { y: 14 }, { y: 0, duration: 0.4, ease: "power3.out" }, 1.8);
          tl.set(q(".small"), { opacity: 1 }, 2.1);
          window.__timelines["v8-outro"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
