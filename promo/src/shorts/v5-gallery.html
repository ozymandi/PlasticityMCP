<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@common*/
        .v5 .i1 svg.dr .v path { stroke-width: 0.67; }
        .v5 .i1 svg.dr .h path { stroke-width: 0.45; }
        .v5 .i2 svg.dr .v path { stroke-width: 0.22; }
        .v5 .i2 svg.dr .h path { stroke-width: 0.15; }
        .v5 .i3 svg.dr .v path { stroke-width: 1.6; }
        .v5 .i3 svg.dr .h path { stroke-width: 1.1; }
        .v5 .item { position: absolute; inset: 0; opacity: 0; }
        .v5 .stage { position: absolute; left: 0; top: 330px; width: 1080px; height: 900px; display: flex; align-items: center; justify-content: center; }
        .v5 .stage svg.dr { width: 980px; height: auto; max-height: 900px; }
        .v5 .stage svg.dr.tall { width: auto; height: 880px; }
        .v5 .render { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
        .v5 .render img { position: absolute; left: 50%; top: 50%; width: 1800px; height: auto; margin-left: -900px; margin-top: -660px; display: block; }
        .v5 .photo { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
        .v5 .photo img { position: absolute; left: 50%; top: 50%; width: 2560px; height: 1440px; margin-left: -1280px; margin-top: -840px; display: block; }
        .v5 .lab { position: absolute; left: 50px; top: 1270px; width: 980px; padding: 30px; border-radius: 16px; background: rgba(22,22,22,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .v5 .lab .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 22px; color: #858585; letter-spacing: 0.14em; margin-bottom: 16px; opacity: 0; }
        .v5 .lab .h2 { font-size: 78px; opacity: 0; }
        .v5 .lab .sub { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 26px; color: #8a8a8a; margin-top: 20px; line-height: 1.6; opacity: 0; }
        .v5 .lab .sub b { color: #c9a57e; font-weight: 500; }
        .v5 .foot { position: absolute; left: 80px; top: 150px; opacity: 0; }
        .v5 .foot .tag { font-size: 26px; padding: 12px 18px; }
        .v5 .wrap { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="v5-gallery" data-width="1080" data-height="1920">
        <div class="v5">
          <div class="wrap">
            <div class="grid"></div>
            <div class="vignette"></div>
            <div class="item i1">
              <div class="stage"><!--@svg:tt-iso--></div>
              <div class="render"><img src="assets/img/tt-iso.png" alt="" /></div>
              <div class="photo"><img src="assets/steel/tt-steel.png" alt="" /></div>
              <div class="lab"><div class="num">02 / 04</div><div class="h2">Technics SL-1200</div><div class="sub">revolve_profile · <b>unwrap_faces</b> → deform</div></div>
            </div>
            <div class="item i2">
              <div class="stage"><!--@svg:cam-iso--></div>
              <div class="render"><img src="assets/img/cam-iso.png" alt="" /></div>
              <div class="photo"><img src="assets/steel/cam-steel.png" alt="" /></div>
              <div class="lab"><div class="num">03 / 04</div><div class="h2">Nikon F2</div><div class="sub">loft_profiles · <b>sweep_profile</b> thread</div></div>
            </div>
            <div class="item i3">
              <div class="stage"><!--@svg:bike-iso--></div>
              <div class="render"><img src="assets/img/bike-iso.png" alt="" /></div>
              <div class="photo"><img src="assets/steel/bike-steel.png" alt="" /></div>
              <div class="lab"><div class="num">04 / 04</div><div class="h2">Mountain bike</div><div class="sub">pipe · mirror_bodies · <b>array_curve</b></div></div>
            </div>
            <div class="foot"><span class="tag">all built by an LLM — <span class="tan">through the MCP</span></span></div>
          </div>
        </div>
      </div>
      <script>
        //@helpers
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(".v5 " + s);
          document.querySelector(".v5 .i2 svg.dr").classList.add("tall");
          const SLOT = 3.35;
          [".i1", ".i2", ".i3"].forEach((sel, i) => {
            const at = i * SLOT;
            tl.set(q(sel), { opacity: 1 }, at);
            const hg = q(sel + " svg.dr .h");
            if (hg) tl.set(hg, { opacity: 0.9 }, at);
            drawOn(tl, ".v5 " + sel + " svg.dr .v path", at + 0.05, 1.2, 0.4, "power1.out");
            drawOn(tl, ".v5 " + sel + " svg.dr .h path", at + 0.25, 1.1, 0.35, "none");
            tl.set(q(sel + " .num"), { opacity: 1 }, at + 0.15);
            tl.set(q(sel + " .h2"), { opacity: 1 }, at + 0.25);
            tl.fromTo(q(sel + " .h2"), { y: 30 }, { y: 0, duration: 0.45, ease: "power4.out" }, at + 0.25);
            tl.set(q(sel + " .sub"), { opacity: 1 }, at + 0.5);
            tl.fromTo(q(sel + " .sub"), { x: -14 }, { x: 0, duration: 0.3, ease: "power3.out" }, at + 0.5);
            tl.to(".v5 " + sel + " svg.dr .v path", { stroke: "#c9a57e", duration: 0.15 }, at + 1.3);
            tl.to(q(sel + " .stage"), { opacity: 0, scale: 1.04, duration: 0.35, ease: "power2.in" }, at + 1.4);
            tl.fromTo(q(sel + " .render"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, at + 1.45);
            tl.fromTo(q(sel + " .render img"), { scale: 1.5 }, { scale: 1.62, duration: 1.0, ease: "none" }, at + 1.4);
            tl.fromTo(q(sel + " .photo"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, at + 2.3);
            const pz = 1.0;
            tl.fromTo(q(sel + " .photo img"), { scale: pz }, { scale: pz * 1.06, duration: 1.05, ease: "none" }, at + 2.3);
            tl.to(q(sel), { opacity: 0, duration: 0.2, ease: "power1.in" }, at + SLOT - 0.2);
          });
          tl.set(q(".foot"), { opacity: 1 }, 0.3);
          tl.fromTo(q(".foot"), { y: -12 }, { y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
          tl.to(q(".foot"), { opacity: 0, duration: 0.2 }, 3 * SLOT - 0.2);
          window.__timelines["v5-gallery"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
