<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #161616; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #161616; }
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- 2D sections of the free-form surfacing promo. Rendered as one file, then cut per section
         (promo/tools/split_sections.py) and placed in After Effects next to the Blender shots. -->
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-fps="24" data-duration="36">
      <div id="el-s1" data-composition-id="s1-open" data-composition-src="compositions/s1-open.html" data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-s2" data-composition-id="s2-maserati" data-composition-src="compositions/s2-maserati.html" data-start="4.5" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-s3" data-composition-id="s3-cube" data-composition-src="compositions/s3-cube.html" data-start="12.5" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-s4" data-composition-id="s4-cards" data-composition-src="compositions/s4-cards.html" data-start="18.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-s5" data-composition-id="s5-sheets" data-composition-src="compositions/s5-sheets.html" data-start="23" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-s6" data-composition-id="s6-stats" data-composition-src="compositions/s6-stats.html" data-start="28" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="el-s7" data-composition-id="s7-outro" data-composition-src="compositions/s7-outro.html" data-start="32" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
