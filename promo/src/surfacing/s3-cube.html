<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*@common*/
        .s3 svg.dr .v path { stroke-width: 1.3; }
        .s3 svg.dr .h path { stroke-width: 0.8; }
        .s3 .stage { position: absolute; left: 70px; top: 120px; width: 1280px; height: 860px; display: flex; align-items: center; justify-content: center; }
        .s3 svg.dr { width: 1240px; height: auto; }
        .s3 .logbox { position: absolute; left: 1360px; top: 170px; width: 540px; }
        .s3 .logbox .hd { font-family: "Owners", sans-serif; font-size: 18px; letter-spacing: 0.12em; color: #8f8f8f; margin-bottom: 18px; opacity: 0; }
        .s3 .log { font-size: 21px; }
        .s3 .log .ok { display: inline-flex; align-items: center; gap: 8px; }
        .s3 .name { position: absolute; left: 70px; top: 64px; display: flex; gap: 14px; align-items: center; opacity: 0; }
        .s3 .name .tag { font-size: 22px; padding: 8px 16px; }
        .s3 .wrap { position: absolute; inset: 0; }
      </style>
      <div id="root" data-composition-id="s3-cube" data-width="1920" data-height="1080">
        <div class="s3">
          <div class="wrap">
            <div class="grid"></div>
            <div class="name">
              <div class="tag">Boat <span class="tan">CUBE</span> · 6 m</div>
              <div class="tag">from one photo</div>
            </div>
            <div class="stage">
              <!--@svg:cube-iso-->
            </div>
            <div class="logbox">
              <div class="hd">TOOL CALLS · FREE-FORM SURFACING</div>
              <div class="log">
                <div class="ln"><span class="k">create_spline</span><span class="arg">24 hull sections</span></div>
                <div class="ln"><span class="k">loft_profiles</span><span class="arg">deck + side · sheer</span></div>
                <div class="ln"><span class="k">mirror_bodies</span><span class="arg">+ join</span></div>
                <div class="ln"><span class="k">patch</span><span class="arg">transom + stem · G0</span></div>
                <div class="ln"><span class="k">fillet</span><span class="arg">sheer · stem · R15</span><span class="ok"><svg class="ic" viewBox="0 0 16 16"><path d="M2.5 8.6l3.6 3.4L13.5 4.2"/></svg></span></div>
                <div class="ln"><span class="k">loft_profiles</span><span class="arg">cabin · 9 sections</span></div>
                <div class="ln"><span class="k">boolean</span><span class="arg">union · R40</span></div>
                <div class="ln"><span class="k">project</span><span class="arg">"CUBE" · ±Y</span></div>
                <div class="ln"><span class="k">imprint</span><span class="arg">offset −3 · engraved</span></div>
                <div class="ln"><span class="k">check_bodies</span><span class="ok">20 solids · valid</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        //@helpers
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(".s3 " + s);
          tl.set(q(".name"), { opacity: 1 }, 0.2);
          tl.fromTo(q(".name"), { y: -12 }, { y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
          drawOn(tl, ".s3 svg.dr .v path", 0.3, 4.0, 1.0, "power1.out");
          tl.set(q("svg.dr .h"), { opacity: 0.8 }, 0);
          drawOn(tl, ".s3 svg.dr .h path", 1.0, 3.6, 0.9, "none");
          tl.set(q(".logbox .hd"), { opacity: 1 }, 0.4);
          logIn(tl, ".s3 .log .ln", 0.6, 0.42, -14);
          tl.to(".s3 svg.dr .v path", { stroke: "#c9a57e", duration: 0.25, ease: "power1.in" }, 4.7);
          tl.to(".s3 svg.dr .v path", { stroke: "#ece9e2", duration: 0.5, ease: "power1.out" }, 5.0);
          tl.to(q(".wrap"), { opacity: 0, duration: 0.35, ease: "power1.in" }, 5.6);
          window.__timelines["s3-cube"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
